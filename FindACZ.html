<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FindACZ · 校区定位工具</title>
<style>
  :root{
    --brand:#2f6fed; --brand-dark:#1f56c8; --brand-bg:#eaf1fe;
    --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
    --bg:#f4f6fa; --card:#ffffff; --line:#e5e9f2; --text:#1f2733; --sub:#6b7686;
    --radius:12px; --shadow:0 1px 3px rgba(16,24,40,.08),0 4px 16px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
  }
  /* ---------- 顶部 ---------- */
  header{
    height:56px; background:var(--card); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px; padding:0 18px; position:relative; z-index:20;
  }
  .logo-img{height:34px; width:auto; flex:none; display:block;}
  .brand{margin-left:2px;}
  .brand-name{font-size:17px; font-weight:700; letter-spacing:.2px; white-space:nowrap;}
  .brand-sub{font-size:12px; color:var(--sub); margin-top:1px;}
  header .spacer{flex:1;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; border:none; cursor:pointer;
    border-radius:9px; padding:8px 14px; font-size:13px; font-weight:600;
    background:var(--brand-bg); color:var(--brand); transition:.15s; white-space:nowrap;
  }
  .btn:hover{background:#dfe9fd;}
  .btn.primary{background:var(--brand); color:#fff;}
  .btn.primary:hover{background:var(--brand-dark);}
  .btn.danger{background:#fee2e2; color:var(--danger);}
  .btn.danger:hover{background:#fecaca;}
  .btn.sm{padding:5px 10px; font-size:12px; border-radius:7px;}
  .btn:disabled{opacity:.55; cursor:not-allowed;}
  /* ---------- 主布局：单列居中 ---------- */
  main{min-height:calc(100% - 56px); padding:16px;}
  #panel{
    max-width:720px; margin:0 auto; background:var(--card); border:1px solid var(--line);
    border-radius:16px; box-shadow:var(--shadow); overflow:hidden;
  }
  .panel-body{padding:18px 16px 24px;}
  .section-title{font-size:13px; font-weight:700; color:var(--sub); margin:16px 0 8px; display:flex; align-items:center; gap:6px;}
  .section-title:first-child{margin-top:0;}
  /* ---------- 搜索 ---------- */
  .search-row{display:flex; gap:8px; max-width:600px; margin:0 auto;}
  .search-row input{
    width:100%; min-width:0; border:1px solid var(--line); border-radius:9px; padding:11px 14px;
    font-size:14px; outline:none; background:#fafbfe; transition:.15s;
  }
  .search-row input:focus{border-color:var(--brand); background:#fff; box-shadow:0 0 0 3px rgba(47,111,237,.12);}
  .search-row .input-wrap{flex:1; position:relative; min-width:0;}
  .suggest-box{position:absolute;top:100%;left:0;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);max-height:320px;overflow-y:auto;z-index:1000;display:none;width:100%;box-sizing:border-box;margin-top:4px;}
  .suggest-box.show{display:block;}
  .suggest-item{padding:9px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid #f1f4f9;}
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item.no-result{cursor:default;}
  .suggest-item .district-tag{font-size:10px; color:#7b8799; background:#f1f4f9; border-radius:4px; padding:1px 5px; flex:none;}
  .suggest-item:hover, .suggest-item.active{background:#f4f8ff;}
  .suggest-item .title{font-weight:600; color:var(--text); display:flex; align-items:center; gap:6px;}
  .suggest-item .addr{font-size:11px; color:var(--sub); margin-top:3px;}
  .loc-status{font-size:12px; color:var(--sub); margin-top:10px; display:flex; align-items:center; justify-content:center; gap:6px; max-width:600px; margin-left:auto; margin-right:auto;}
  .loc-status .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .dot.ok{background:var(--ok);} .dot.loading{background:var(--warn); animation:blink 1s infinite;}
  .dot.err{background:var(--danger);}
  .dot.none{background:#c3c9d4;}
  @keyframes blink{50%{opacity:.3;}}
  /* ---------- 推荐卡片 ---------- */
  .rec-top{
    display:flex; align-items:center; gap:10px; background:linear-gradient(135deg,#f7faff,#eef4ff);
    border:1px solid #d9e6ff; border-radius:var(--radius); padding:10px 12px; margin-top:12px;
  }
  .rec-top .rank{
    width:34px; height:34px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#ffb020,#ff8a00); color:#fff; font-weight:800; font-size:16px;
    box-shadow:0 3px 8px rgba(255,138,0,.35);
  }
  .rec-top .name{font-weight:700; font-size:14px;}
  .rec-top .meta{font-size:12px; color:var(--sub);}
  .rec-top .dist{margin-left:auto; text-align:right; font-weight:800; color:var(--brand); font-size:15px; white-space:nowrap;}
  .rec-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;}
  .rec-card{
    border:1px solid var(--line); border-radius:10px; padding:9px 10px; cursor:pointer; transition:.15s; background:#fff;
  }
  .rec-card:hover{border-color:var(--brand); box-shadow:var(--shadow);}
  .rec-card .r2{display:flex; align-items:center; gap:6px; margin-bottom:2px;}
  .rec-card .rank2{width:20px; height:20px; border-radius:50%; background:#eef2f8; color:#556; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;}
  .rec-card .name{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rec-card .meta{font-size:11px; color:var(--sub);}
  .rec-card .dist{font-size:12px; font-weight:700; color:var(--brand);}
  /* ---------- 校区列表 ---------- */
  .dist-group{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700;
    color:#5a6478; margin:14px 0 7px; padding-left:2px; letter-spacing:.5px;}
  .dist-group::before{content:""; width:8px; height:8px; border-radius:50%;
    background:#2f6fed; flex:none;}
  .dist-group .cnt{font-weight:600; color:#8a94a6; background:#f1f4f9;
    border-radius:9px; padding:1px 8px; font-size:10px; letter-spacing:0;}
  .campus-item{
    border:1px solid var(--line); border-radius:10px; padding:9px 10px; margin-bottom:8px;
    background:#fff; cursor:pointer; transition:.15s; position:relative;
  }
  .campus-item:hover{border-color:var(--brand); box-shadow:var(--shadow);}
  .campus-item.active{border-color:var(--brand); background:var(--brand-bg);}
  .campus-item .top{display:flex; align-items:center; gap:8px;}
  .campus-item .pin{width:9px; height:9px; border-radius:50%; flex:none; background:#2f6fed;}
  .campus-item .nm{font-weight:600; font-size:13px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .campus-item .dist{font-size:12px; font-weight:700; color:var(--brand); white-space:nowrap;}
  .campus-item .addr{font-size:11px; color:var(--sub); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .campus-item .row2{display:flex; align-items:center; gap:6px; margin-top:6px;}
  .campus-item .mgr{font-size:11px; color:#475069; background:#f1f4f9; border-radius:6px; padding:2px 7px;}
  .campus-item .qr-thumb{width:20px; height:20px; border-radius:4px; object-fit:cover; border:1px solid var(--line);}
  .campus-item .del{margin-left:auto; visibility:hidden;}
  .campus-item:hover .del{visibility:visible;}
  .empty-tip{color:var(--sub); font-size:12px; text-align:center; padding:24px 0;}
  /* ---------- 详情卡 ---------- */
  #detailCard{display:none; border:1px solid #d9e6ff; background:linear-gradient(180deg,#f7faff,#fff);
    border-radius:var(--radius); padding:12px; margin-top:12px;}
  #detailCard.show{display:block;}
  .detail-h{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .detail-h .name{font-weight:700; font-size:15px; flex:1;}
  .detail-row{font-size:12px; color:var(--sub); margin-top:4px; display:flex; gap:6px;}
  .detail-row b{color:var(--text); font-weight:600;}
  .detail-qr{margin-top:10px;}
  .detail-qr img{width:120px; height:120px; object-fit:contain; border:1px solid var(--line); border-radius:8px; cursor:zoom-in; background:#fff;}
  .detail-qr .qr-tip{font-size:11px; color:var(--sub); margin-top:4px;}
  .detail-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  #btnSettings{margin-left:4px;}
  #settingsMask{
    position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:100; display:none;
    align-items:flex-start; justify-content:center; padding:48px 16px; overflow-y:auto;
  }
  #settingsMask.show{display:flex;}
  .sync-ok{color:var(--ok);} .sync-err{color:var(--danger);} .sync-warn{color:var(--warn);}
  .setting-section{margin:14px 0 8px; font-size:12px; font-weight:700; color:var(--sub);}
  .hint code{background:#f1f4f9; padding:1px 4px; border-radius:4px; font-size:11px;}
  .export-box{
    width:100%; min-height:90px; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-size:12px; font-family:monospace; background:#fafbfe; resize:vertical; outline:none;
  }
  .export-box:focus{border-color:var(--brand); background:#fff;}
  /* ---------- 模态框 ---------- */
  #modalMask{
    position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:100; display:none;
    align-items:flex-start; justify-content:center; padding:48px 16px; overflow-y:auto;
  }
  #modalMask.show{display:flex;}
  .modal{
    background:#fff; border-radius:16px; width:100%; max-width:460px; box-shadow:0 20px 60px rgba(15,23,42,.25);
    padding:20px; animation:pop .18s ease;
  }
  @keyframes pop{from{transform:translateY(12px); opacity:0;} to{transform:none; opacity:1;}}
  .modal{position:relative;}
  .modal-close{position:absolute; top:12px; right:14px; width:32px; height:32px; border:none; background:transparent; color:var(--sub); font-size:24px; cursor:pointer; border-radius:8px; display:flex; align-items:center; justify-content:center; line-height:1; z-index:2;}
  .modal-close:hover{background:#f1f4f9; color:var(--text);}
  .modal-h{font-size:16px; font-weight:700; display:flex; align-items:center; margin-bottom:14px; padding-right:34px;}
  .form-item{margin-bottom:12px;}
  .form-item label{display:block; font-size:12px; color:var(--sub); margin-bottom:5px; font-weight:600;}
  .form-item input[type=text], .form-item select{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; outline:none; background:#fafbfe;
  }
  .form-item input:focus, .form-item select:focus{border-color:var(--brand); background:#fff;}
  .form-item .hint{font-size:11px; color:var(--sub); margin-top:4px;}
  .geo-status{font-size:11px; color:var(--sub); margin-top:4px; display:none;}
  .geo-status.show{display:block;}
  .geo-status.ok{color:var(--ok);} .geo-status.err{color:var(--danger);}
  .file-box{
    border:1.5px dashed #c9d4e8; border-radius:10px; padding:14px; text-align:center; cursor:pointer;
    background:#fafcff; transition:.15s; position:relative;
  }
  .file-box:hover{border-color:var(--brand); background:#f4f8ff;}
  .file-box input{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .file-box .ft{font-size:12px; color:var(--sub);}
  .file-box .ft b{color:var(--brand);}
  .file-preview{display:none; margin-top:8px; align-items:center; gap:10px;}
  .file-preview img{width:84px; height:84px; object-fit:contain; border:1px solid var(--line); border-radius:8px; background:#fff;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-actions .btn{flex:1; justify-content:center; padding:10px;}
  /* ---------- 图片放大 ---------- */
  #zoomMask{position:fixed; inset:0; background:rgba(10,15,25,.82); z-index:200; display:none; align-items:center; justify-content:center; cursor:zoom-out;}
  #zoomMask.show{display:flex;}
  #zoomMask img{max-width:88vw; max-height:88vh; background:#fff; padding:10px; border-radius:12px;}
  /* ---------- 确认对话框 ---------- */
  #confirmMask{position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:1000; display:none; align-items:flex-start; justify-content:center; padding:48px 16px;}
  #confirmMask.show{display:flex;}
  .confirm-modal{background:#fff; border-radius:16px; width:100%; max-width:360px; box-shadow:0 20px 60px rgba(15,23,42,.25); padding:20px; animation:pop .18s ease; position:relative;}
  .confirm-title{font-size:16px; font-weight:700; margin-bottom:8px;}
  .confirm-body{font-size:13px; color:var(--sub); line-height:1.6; margin-bottom:18px;}
  .confirm-actions{display:flex; gap:10px;}
  .confirm-actions .btn{flex:1; justify-content:center; padding:10px; position:relative; z-index:1;}
  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px); z-index:300;
    background:#1f2733; color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; opacity:0;
    pointer-events:none; transition:.25s; max-width:82vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%);}
  .map-hint{
    position:absolute; left:12px; bottom:14px; z-index:10; background:rgba(255,255,255,.94); color:var(--sub);
    font-size:11px; padding:6px 10px; border-radius:8px; box-shadow:var(--shadow); display:none;
  }
  /* ---------- 响应式 ---------- */
  @media (max-width:820px){
    main{padding:10px;}
    #panel{border-radius:12px;}
    header{padding:0 12px;}
    .brand-sub{display:none;}
    header .btn .bt{display:none;}
    .rec-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <img class="logo-img" src="爱成长logo.png" alt="爱成长">
  <div>
    <div class="brand-name">FindACZ</div>
    <div class="brand-sub">爱成长 · 校区定位</div>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btnLocate" title="定位我的位置"><span>📍</span><span class="bt">定位我的位置</span></button>
  <button class="btn primary" id="btnAdd"><span>＋</span><span class="bt">添加校区</span></button>
  <button class="btn" id="btnSettings" title="设置"><span>⚙️</span></button>
</header>

<main>
  <aside id="panel">
    <div class="panel-body" id="panelBody">
      <div class="section-title" style="text-align:center;font-size:15px;margin-bottom:12px;">🔍 查询距离</div>
      <div class="search-row">
        <div class="input-wrap">
          <input id="addrInput" type="text" placeholder="输入地址，如：北京市海淀区中关村大街…" autocomplete="off">
          <div id="searchSuggestions" class="suggest-box"></div>
        </div>
        <button class="btn primary" id="btnSearch">查询</button>
      </div>
      <div class="loc-status"><span class="dot none" id="locDot"></span><span id="locText">尚未定位，可点击上方「定位我的位置」或输入地址查询</span></div>

      <div id="recBox" style="display:none;max-width:600px;margin:16px auto 0;">
        <div class="section-title">🏆 最近校区推荐</div>
        <div id="recTop"></div>
        <div class="rec-grid" id="recGrid"></div>
      </div>

      <div id="detailCard" style="max-width:600px;margin:16px auto 0;"></div>

      <div class="section-title" id="listTitle">🏫 全部校区</div>
      <div id="campusList"></div>
    </div>
  </aside>
</main>

<!-- 设置模态框 -->
<div id="settingsMask">
  <div class="modal">
    <button class="modal-close" id="settingsClose" type="button" aria-label="关闭">×</button>
    <div class="modal-h">⚙️ 设置</div>
    <div class="form-item">
      <label>腾讯地图 Key <a href="https://lbs.qq.com/dev/console/key/manage" target="_blank" rel="noopener" style="font-weight:400;font-size:11px;color:var(--brand);">如何获取？</a></label>
      <input type="text" id="sTmapKey" placeholder="粘贴你的腾讯地图 Key">
      <div class="hint">用于地址解析和搜索联想。默认已内置官方示例 Key 可直接使用；Key 仅保存在本浏览器 localStorage，不会上传。</div>
    </div>
    <div class="form-item">
      <label>腾讯密钥 SK <span style="font-weight:400;font-size:11px;color:var(--sub);">（选填，仅当你的 Key 在控制台开启了「签名校验」时填写）</span></label>
      <input type="text" id="sTmapSecret" placeholder="填写 SecretKey，未开启签名校验可留空">
      <div class="hint">与 Key 配套使用。仅保存在浏览器本地。</div>
    </div>
    <div class="setting-section">云端同步（可选，用于多浏览器/多设备同步）</div>
    <div class="form-item">
      <label>GitHub Token <a href="https://github.com/settings/tokens/new?description=FindACZ%20Sync&scopes=gist" target="_blank" rel="noopener" style="font-weight:400;font-size:11px;color:var(--brand);">创建 Token</a></label>
      <input type="password" id="sGhToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx 或 github_pat_...">
      <div class="hint">需要 <code>gist</code> 权限。Token 仅保存在本浏览器。</div>
    </div>
    <div class="form-item">
      <label>Gist ID <span style="font-weight:400;font-size:11px;color:var(--sub);">（留空则首次保存时自动创建）</span></label>
      <input type="text" id="sGistId" placeholder="例如：a1b2c3d4e5f6...">
    </div>
    <div class="form-item">
      <label>同步状态</label>
      <div id="syncStatus" class="geo-status show" style="display:block;">未配置云端同步</div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="settingsCancel">取消</button>
      <button class="btn primary" id="settingsSave">保存并应用</button>
    </div>
    <div class="setting-section">手动同步（不依赖 GitHub）</div>
    <div class="form-item">
      <label>导出/导入校区数据</label>
      <textarea id="sExportBox" class="export-box" placeholder="点击「导出」会在此处生成 JSON，复制后在其他设备点击「导入」粘贴即可"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn sm" id="sExport">📋 导出</button>
        <button class="btn sm" id="sImport">📥 导入</button>
      </div>
    </div>
  </div>
</div>

<!-- 添加/编辑校区模态框 -->
<div id="modalMask">
  <div class="modal">
    <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
    <div class="modal-h" id="modalTitle">＋ 添加校区</div>
    <div class="form-item">
      <label>校区名称 *</label>
      <input type="text" id="fName" placeholder="如：朝阳新校区" maxlength="30">
    </div>
    <div class="form-item">
      <label>校区地址 *</label>
      <input type="text" id="fAddress" placeholder="如：北京市朝阳区…">
      <div class="geo-status" id="fGeoStatus"></div>
    </div>
    <div class="form-item">
      <label>所属区域</label>
      <select id="fDistrict">
        <option value="">自动识别 / 未分类</option>
        <option>海淀区</option><option>朝阳区</option><option>西城区</option>
        <option>东城区</option><option>昌平区</option><option>其他</option>
      </select>
    </div>
    <div class="form-item">
      <label>负责人 *</label>
      <input type="text" id="fManager" placeholder="负责人姓名" maxlength="20">
    </div>
    <div class="form-item">
      <label>负责人联系方式（微信二维码）</label>
      <div class="file-box">
        <input type="file" id="fQr" accept="image/*">
        <div class="ft">📷 点击上传二维码图片<b>（可暂不传，后续在编辑中补充）</b></div>
      </div>
      <div class="file-preview" id="fQrPreview"><img id="fQrImg" alt="二维码预览"><span id="fQrName"></span></div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="btnCancel">取消</button>
      <button class="btn primary" id="btnSave">保存校区</button>
    </div>
  </div>
</div>

<!-- 二次确认对话框 -->
<div id="confirmMask">
  <div class="confirm-modal">
    <div class="confirm-title" id="confirmTitle">确认操作</div>
    <div class="confirm-body" id="confirmBody">确定要继续吗？</div>
    <div class="confirm-actions">
      <button class="btn" id="confirmCancel" type="button">取消</button>
      <button class="btn primary" id="confirmOk" type="button">确定</button>
    </div>
  </div>
</div>

<div id="zoomMask"><img id="zoomImg" alt="二维码"></div>
<div id="toast"></div>

<script>
/* =====================================================================

/* ---------- 安全存储（file:// 下 localStorage 可能不可用） ---------- */
var memStore = {};
var storage = (function(){
  try{
    var k = "__t"; localStorage.setItem(k,"1"); localStorage.removeItem(k);
    return localStorage;
  }catch(e){ return {getItem:function(n){return memStore[n]||null;}, setItem:function(n,v){memStore[n]=String(v);}, removeItem:function(n){delete memStore[n];}}; }
})();
function sGet(key, def){
  try{ var v = storage.getItem("fx_" + key); return v ? JSON.parse(v) : def; }catch(e){ return def; }
}
function sSet(key, val, skipSync){
  try{ storage.setItem("fx_" + key, JSON.stringify(val)); }catch(e){ toast("本地存储空间不足，二维码图片可能过大"); }
  if(!skipSync && ["custom","deleted","overrides","qr","geoCache_v3"].indexOf(key) >= 0){ syncPush(); }
}

};
var runtimeCache = {}; // 校区id -> {ll:{lat,lng}, d:number}，保存运行时解析出的坐标与距离
function setCampusPos(c, ll){
  runtimeCache[c.id] = runtimeCache[c.id] || {};
  runtimeCache[c.id].ll = ll;
  c._ll = ll;
}
function setCampusDist(c, d){
  runtimeCache[c.id] = runtimeCache[c.id] || {};
  runtimeCache[c.id].d = d;
  c._d = d;
}
function allCampuses(){
  var list = BUILTIN.filter(function(c){ return !state.deletedIds.has(c.id); })
    .map(function(c){
      var o={}; for(var k in c) o[k]=c[k];
      var ov = state.overrides[c.id];
      if(ov){ for(var k in ov){ if(ov[k] != null && ov[k] !== "") o[k] = ov[k]; } }
      o.custom=false; return o;
    });
  state.custom.forEach(function(c){
    if(!state.deletedIds.has(c.id)){
      var o={}; for(var k in c) o[k]=c[k]; o.custom=true; list.push(o);
    }
  });
  list.forEach(function(c){
    var r = runtimeCache[c.id];
    if(r){ c._ll = r.ll; c._d = r.d; }
  });
  return list;
}

/* ---------- 设置与云端同步 ---------- */
var DEFAULT_TMAP_KEY = "OB4BZ-D4W3U-B7VVO-4PJWW-6TKDJ-WPB77";
var DEFAULT_TMAP_SECRET = "";
function effectiveTmapKey(){ return settings.tmapKey || DEFAULT_TMAP_KEY; }
function effectiveTmapSecret(){ return settings.tmapSecret || DEFAULT_TMAP_SECRET; }
var settings = {
  tmapKey: sGet("tmapKey", DEFAULT_TMAP_KEY),
  tmapSecret: sGet("tmapSecret", DEFAULT_TMAP_SECRET),

  gistId: sGet("gistId", "")
};
var syncTimer;

function openSettings(){
  $("sTmapKey").value = effectiveTmapKey();
  $("sTmapSecret").value = effectiveTmapSecret();
  $("sGhToken").value = settings.ghToken || "";
  $("sGistId").value = settings.gistId || "";
  $("sExportBox").value = "";
  updateSyncStatus();
  $("settingsMask").classList.add("show");
}
function closeSettings(){
  $("settingsMask").classList.remove("show");
}
function updateSyncStatus(msg, cls){
  var el = $("syncStatus");
  if(!msg){
    if(!settings.ghToken){ msg = "未配置云端同步（未填写 GitHub Token）"; cls = ""; }
    else if(!settings.gistId){ msg = "已填写 Token，保存时将自动创建 Gist"; cls = "sync-warn"; }
    else { msg = "已配置云端同步（Gist: " + settings.gistId.slice(0,8) + "...）"; cls = "sync-ok"; }
  }
  el.textContent = msg; el.className = "geo-status show " + (cls || "");
  el.style.display = "block";
}

function getSyncData(){
  return {
    custom: state.custom,
    deleted: Array.from(state.deletedIds),
    overrides: state.overrides,
    qr: state.qrCache,
    geoCache_v3: state.geoCache,
    version: 1,
    updatedAt: new Date().toISOString()
  };
}
function applySyncData(data){
  if(!data || typeof data !== "object") return false;
  if(data.custom){ state.custom = data.custom; sSet("custom", state.custom, true); }
  if(Array.isArray(data.deleted)){ state.deletedIds = new Set(data.deleted); sSet("deleted", data.deleted, true); }
  if(data.overrides){ state.overrides = data.overrides; sSet("overrides", state.overrides, true); }
  if(data.qr){ state.qrCache = data.qr; sSet("qr", state.qrCache, true); }
  if(data.geoCache_v3){ state.geoCache = data.geoCache_v3; sSet("geoCache_v3", state.geoCache, true); }
  return true;
}

function syncPull(){
  if(!settings.ghToken || !settings.gistId) return Promise.resolve(null);
  updateSyncStatus("正在从云端拉取…", "sync-warn");
  return fetch("https://api.github.com/gists/" + settings.gistId, {
    headers: { "Authorization": "Bearer " + settings.ghToken, "Accept": "application/vnd.github.v3+json" }
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(gist){
    var f = gist.files && gist.files["findacz-data.json"];
    if(!f || !f.content) return null;
    var data = JSON.parse(f.content);
    var changed = applySyncData(data);
    updateSyncStatus("同步成功（" + new Date().toLocaleTimeString() + "）", "sync-ok");
    return { data: data, changed: changed };
  }).catch(function(e){
    updateSyncStatus("同步失败：" + e.message, "sync-err");
    throw e;
  });
}
function syncPush(){
  if(!settings.ghToken) return Promise.resolve();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){
    if(!settings.gistId){ ensureGist().then(doPush).catch(function(e){ updateSyncStatus("云端保存失败：" + e.message, "sync-err"); }); return; }
    doPush();
  }, 2000);
}
function doPush(){
  if(!settings.ghToken || !settings.gistId) return;
  var content = JSON.stringify(getSyncData());
  if(content.length > 900000){ updateSyncStatus("数据超过 900KB，请删除部分二维码后再同步", "sync-err"); return; }
  updateSyncStatus("正在保存到云端…", "sync-warn");
  fetch("https://api.github.com/gists/" + settings.gistId, {
    method: "PATCH",
    headers: { "Authorization": "Bearer " + settings.ghToken, "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" },
    body: JSON.stringify({ files: { "findacz-data.json": { content: content } } })
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    updateSyncStatus("已保存到云端（" + new Date().toLocaleTimeString() + "）", "sync-ok");
  }).catch(function(e){
    updateSyncStatus("云端保存失败：" + e.message, "sync-err");
  });
}
function ensureGist(){
  if(!settings.ghToken) return Promise.reject(new Error("请先填写 GitHub Token"));
  if(settings.gistId) return Promise.resolve(settings.gistId);
  updateSyncStatus("正在创建 Gist…", "sync-warn");
  return fetch("https://api.github.com/gists", {
    method: "POST",
    headers: { "Authorization": "Bearer " + settings.ghToken, "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" },
    body: JSON.stringify({
      description: "FindACZ 校区数据同步",
      public: false,
      files: { "findacz-data.json": { content: JSON.stringify(getSyncData()) } }
    })
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(gist){
    settings.gistId = gist.id;
    sSet("gistId", gist.id);
    $("sGistId").value = gist.id;
    updateSyncStatus("已创建 Gist", "sync-ok");
    return gist.id;
  });
}

function saveSettings(){
  var key = $("sTmapKey").value.trim() || DEFAULT_TMAP_KEY;
  var secret = $("sTmapSecret").value.trim();
  var token = $("sGhToken").value.trim();
  var gistId = $("sGistId").value.trim();
  settings.tmapKey = key;
  settings.tmapSecret = secret;
  settings.ghToken = token;
  settings.gistId = gistId;
  sSet("tmapKey", key);
  sSet("tmapSecret", secret);
  sSet("ghToken", token);
  sSet("gistId", gistId);
  updateSyncStatus();
  closeSettings();
  toast("设置已保存");
  if(token && !gistId){
    ensureGist().then(function(){ syncPush(); }).catch(function(){});
  }else if(token && gistId){
    syncPush();
  }
  resolveAllCampuses();
}

/* ---------- 腾讯地图 WebService API（地址解析 / 搜索联想 / 坐标转换） ---------- */
function tmapBuildUrl(api, q){
  var qq = {}; Object.keys(q).forEach(function(k){ qq[k] = q[k]; });
  var secret = effectiveTmapSecret();
  if(secret){
    // 签名：md5(请求路径 + "?" + 排序后的原始参数 + "&sk=" + SK)
    var sorted = Object.keys(qq).sort().map(function(k){ return k + "=" + qq[k]; }).join("&");
    qq.sig = md5("/ws/" + api + "?" + sorted + "&sk=" + secret);
  }
  var qs = Object.keys(qq).map(function(k){ return encodeURIComponent(k) + "=" + encodeURIComponent(qq[k]); }).join("&");
  return "https://apis.map.qq.com/ws/" + api + "?" + qs;
}
var __tmapSeq = 0;
function tmapJsonp(url, cbName, cb){
  var done = false;
  window[cbName] = function(data){ if(!done){ done = true; cleanup(); cb(data); } };
  function cleanup(){
    try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; }
    var s = document.getElementById(cbName);
    if(s && s.parentNode) s.parentNode.removeChild(s);
  }
  var s = document.createElement("script");
  s.id = cbName; s.src = url;
  s.onerror = function(){ if(!done){ done = true; cleanup(); cb(null); } };
  document.head.appendChild(s);
  setTimeout(function(){ if(!done){ done = true; cleanup(); cb(null); } }, 12000);
}
function tmapReq(api, params){
  return new Promise(function(resolve){
    var key = effectiveTmapKey();
    if(!key){ resolve(null); return; }
    var q = { key: key };
    Object.keys(params).forEach(function(k){ q[k] = params[k]; });
    var url = tmapBuildUrl(api, q);
    fetch(url).then(function(r){ return r.json(); }).then(function(d){ resolve(d); }).catch(function(){
      // fetch 失败（如 file:// 下 CORS 受限）时回退到 JSONP
      var q2 = {}; Object.keys(q).forEach(function(k){ q2[k] = q[k]; });
      var cbName = "__tmapCb" + (++__tmapSeq);
      q2.output = "jsonp"; q2.callback = cbName;
      tmapJsonp(tmapBuildUrl(api, q2), cbName, resolve);
    });
  });
}
/* 本地 WGS84 → GCJ02（火星坐标）转换算法，无需 Key。
   浏览器定位返回 WGS84，校区/腾讯坐标是 GCJ02。
   API 不可用（如示例 Key 被限流）时用它兜底，误差在 1 米内，显示距离完全够用。 */
var __wgs2gcjLocal = (function(){
  var a = 6378245.0, ee = 0.00669342162296594323;
  function outOfChina(lat, lng){
    return (lng < 72.004 || lng > 137.8347) || (lat < 0.8293 || lat > 55.8271);
  }
  function tLat(x, y){
    var ret = -100.0 + 2.0*x + 3.0*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
    ret += (20.0*Math.sin(6.0*x*Math.PI) + 20.0*Math.sin(2.0*x*Math.PI)) * 2.0/3.0;
    ret += (20.0*Math.sin(y*Math.PI) + 40.0*Math.sin(y/3.0*Math.PI)) * 2.0/3.0;
    ret += (160.0*Math.sin(y/12.0*Math.PI) + 320*Math.sin(y*Math.PI/30.0)) * 2.0/3.0;
    return ret;
  }
  function tLng(x, y){
    var ret = 300.0 + x + 2.0*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
    ret += (20.0*Math.sin(6.0*x*Math.PI) + 20.0*Math.sin(2.0*x*Math.PI)) * 2.0/3.0;
    ret += (20.0*Math.sin(x*Math.PI) + 40.0*Math.sin(x/3.0*Math.PI)) * 2.0/3.0;
    ret += (150.0*Math.sin(x/12.0*Math.PI) + 300.0*Math.sin(x/30.0*Math.PI)) * 2.0/3.0;
    return ret;
  }
  return function(lat, lng){
    if(outOfChina(lat, lng)) return {lat: lat, lng: lng};
    var dLat = tLat(lng - 105.0, lat - 35.0);
    var dLng = tLng(lng - 105.0, lat - 35.0);
    var radLat = lat/180.0*Math.PI;
    var magic = Math.sin(radLat);
    magic = 1 - ee*magic*magic;
    var sqrtMagic = Math.sqrt(magic);
    dLat = (dLat*180.0)/((a*(1-ee))/(magic*sqrtMagic)*Math.PI);
    dLng = (dLng*180.0)/(a/sqrtMagic*Math.cos(radLat)*Math.PI);
    return {lat: lat + dLat, lng: lng + dLng};
  };
})();
function wgs2gcj(ll){
  // 首选腾讯坐标转换接口；Key 缺失/失效时回退本地算法
  return tmapReq("coord/v1/translate", { locations: ll.lat + "," + ll.lng, type: 1 }).then(function(res){
    if(res && res.status === 0 && res.locations && res.locations.length){
      var p = res.locations[0];
      return {lat: p.lat, lng: p.lng};
    }
    return __wgs2gcjLocal(ll.lat, ll.lng);
  });
}
function utf8(s){ return unescape(encodeURIComponent(s)); }
function md5(string){
  function safe_add(x,y){ var lsw=(x&0xFFFF)+(y&0xFFFF); return (((x>>16)+(y>>16)+(lsw>>16))<<16)|(lsw&0xFFFF); }

function fmtDist(m){

function haversine(a, b){
  var R = 6371000, rad = Math.PI/180;
  var dLat = (b.lat - a.lat)*rad, dLng = (b.lng - a.lng)*rad;
  var s = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(s));
}

/* ---------- 地址解析（腾讯地图 WebService，带多重回退） ---------- */
function cacheGeo(address, ll){
  state.geoCache[address] = {lat: ll.lat, lng: ll.lng};
  sSet("geoCache_v3", state.geoCache);
}
function tryGeocode(address){
  return tmapReq("geocoder/v1", { address: address, region: "北京" }).then(function(res){
    if(res && res.status === 0 && res.result && res.result.location){
      var loc = res.result.location;
      return {lat: loc.lat, lng: loc.lng};
    }
    return null;
  });
}
function searchPlace(keyword){
  return tmapReq("place/v1/search", { keyword: keyword, boundary: "region(北京,0)", page_size: 5 }).then(function(res){
    if(res && res.status === 0 && res.data && res.data.length){
      for(var i=0;i<res.data.length;i++){
        var loc = res.data[i].location;
        if(loc && loc.lat != null && loc.lng != null) return {lat: loc.lat, lng: loc.lng};
      }
    }
    return null;
  });
}
function fetchSuggestions(keyword, limit){
  return tmapReq("place/v1/suggestion", { keyword: keyword, region: "北京", page_size: limit || 8 }).then(function(res){
    if(res && res.status === 0 && res.data && res.data.length){
      return res.data.map(function(d){
        var loc = d.location;
        return {
          title: d.title || "",
          address: d.address || "",
          district: (d.ad_info && d.ad_info.district) || "",
          location: loc ? {lat: loc.lat, lng: loc.lng} : null
        };
      }).filter(function(it){ return it.title || it.location; }).slice(0, limit || 8);
    }
    return [];
  });
}
function makeCandidates(address){
  var list = [address];
  var hasBj = address.indexOf("北京") === 0;
  if(!hasBj) list.push("北京市" + address);
  list.push(address + " 北京");
  if(!hasBj) list.push("北京市" + address + " 北京");
  // 常见后缀退化，帮助模糊地名命中
  var suffixes = ["园","小区","号楼","号院","社区","公寓","大厦","中心","广场"];
  suffixes.forEach(function(s){
    if(address.length > s.length && address.lastIndexOf(s) === address.length - s.length){
      var root = address.slice(0, address.length - s.length);
      list.push(root);
      if(!hasBj) list.push("北京市" + root);
    }
  });
  // 去重
  return list.filter(function(v,i,a){ return a.indexOf(v) === i; });
}
function geocode(address){
  return new Promise(function(resolve){
    if(state.geoCache[address]){ resolve({lat: state.geoCache[address].lat, lng: state.geoCache[address].lng}); return; }
    var candidates = makeCandidates(address);
    function tryOne(idx){
      if(idx >= candidates.length){ resolve(null); return; }
      var kw = candidates[idx];
      tryGeocode(kw).then(function(ll){
        if(ll){ cacheGeo(address, ll); resolve(ll); return; }
        searchPlace(kw).then(function(ll2){
          if(ll2){ cacheGeo(address, ll2); resolve(ll2); return; }
          tryOne(idx + 1);
        });
      });
    }
    tryOne(0);
  });
}
function geocodeCampus(c){
  return geocode(c.geo || c.address).then(function(ll){ return ll; });
}

/* ---------- 校区坐标解析 ---------- */
function resolveAllCampuses(){
  var cps = allCampuses(), okCount = 0;
  function processOne(idx){
    if(idx >= cps.length){
      if(okCount === 0 && cps.length){
        toast("校区坐标解析失败：请检查设置中的腾讯地图 Key（当前为官方示例 Key，可能被限流，建议申请自己的 Key 替换）");
      }
      refreshDistances();
      return;
    }
    var c = cps[idx];
    geocodeCampus(c).then(function(ll){
      if(ll){ setCampusPos(c, ll); okCount++; }
      setTimeout(function(){ processOne(idx + 1); }, 70);
    });
  }
  processOne(0);
}

/* ---------- 定位 / 搜索 ---------- */
function setMyLocation(ll, label){
  state.myLoc = {lat:ll.lat, lng:ll.lng, label:label};
  state.origin = state.myLoc;
  state.searchLoc = null;
  setLocStatus("ok", "定位成功：" + label);
  refreshDistances();
}
function setLocStatus(cls, text){
  var dot = $("locDot"); dot.className = "dot " + cls;
  $("locText").textContent = text;
}
function doSearch(){
  var addr = $("addrInput").value.trim();
  if(!addr){ toast("请输入要查询的地址"); return; }
  setLocStatus("loading", "正在解析地址…");
  geocode(addr).then(function(ll){
    if(!ll){
      setLocStatus("err", "地址解析失败，请补充更详细的信息（如：北京市XX区XX路XX号）");
      return;
    }
    state.searchLoc = {lat:ll.lat, lng:ll.lng, label:addr};
    state.origin = state.searchLoc;
    setLocStatus("ok", "查询地址：" + addr);
    refreshDistances();
  });
}
function refreshDistances(){
  if(!state.origin){ renderCampusList(); return; }
  var cps = allCampuses(), withPos = cps.filter(function(c){ return c._ll; });
  var pending = cps.filter(function(c){ return !c._ll; });
  var wait = Promise.resolve();
  pending.forEach(function(c){
    wait = wait.then(function(){
      return geocodeCampus(c).then(function(ll){
        if(ll){ setCampusPos(c, ll); }
      });
    });
  });
  wait.then(function(){
    var list = [];
    cps.forEach(function(c){
      if(c._ll){
        var d = haversine(state.origin, c._ll);
        list.push({c:c, d:d});
        setCampusDist(c, d);
      }else{ setCampusDist(c, null); }
    });
    list.sort(function(a,b){ return a.d - b.d; });
    state.distances = list;
    renderRecommend(list);
    renderCampusList();
  });
}

/* ---------- 渲染：校区列表（始终按区域分组） ---------- */
var DISTRICT_ORDER = ["海淀区","东城区","朝阳区","西城区","昌平区"];
function renderCampusList(){
  var cps = allCampuses();
  $("listTitle").textContent = "🏫 全部校区（" + cps.length + " 所）";
  var box = $("campusList"), html = "";
  // 按区域分组
  var groups = {};
  cps.forEach(function(c){ (groups[c.district || "其他"] = groups[c.district || "其他"] || []).push(c); });
  // 区域顺序：海淀→东城→朝阳→西城→昌平，未列出的区域（如自定义）依次排在后面
  var order = DISTRICT_ORDER.slice();
  Object.keys(groups).forEach(function(d){ if(order.indexOf(d) === -1) order.push(d); });
  order.forEach(function(d){
    var arr = groups[d];
    if(!arr) return;
    // 组内：已定位/查询时按距离近→远，否则保持内置顺序
    arr = arr.slice().sort(function(a,b){
      var da = a._d == null ? 1e18 : a._d, db = b._d == null ? 1e18 : b._d;
      return da - db;
    });
    html += '<div class="dist-group">' + esc(d) + '<span class="cnt">' + arr.length + ' 所</span></div>';
    arr.forEach(function(c){ html += campusItemHtml(c); });
  });
  box.innerHTML = html || '<div class="empty-tip">暂无校区数据</div>';
  [].forEach.call(box.querySelectorAll(".campus-item"), function(el){
    var id = el.getAttribute("data-id");
    el.addEventListener("click", function(ev){
      if(ev.target.closest(".del")) return;
      selectCampus(id);
    });
    var del = el.querySelector(".del");
    del && del.addEventListener("click", function(){ deleteCampus(id); });
  });
}

function renderSuggestions(list){
  var box = $("searchSuggestions"), html = "";
  if(!list || !list.length){
    box.innerHTML = '<div class="suggest-item no-result">未找到相关地点</div>';
    box.classList.add("show");
    currentSuggestions = []; suggestIndex = -1;
    return;
  }
  currentSuggestions = list; suggestIndex = -1;
  list.forEach(function(item, idx){
    var district = item.district || ((item.address || "").match(/[^省]+市-?([^区县]+[区县])/) || [])[1] || "";
    html += '<div class="suggest-item" data-index="' + idx + '">' +
      '<div class="title"><span>' + esc(item.title) + '</span>' +
      (district ? '<span class="district-tag">' + esc(district) + '</span>' : '') + '</div>' +
      (item.address ? '<div class="addr">' + esc(item.address) + '</div>' : '') +
      '</div>';
  });
  box.innerHTML = html;
  box.classList.add("show");
  [].forEach.call(box.querySelectorAll(".suggest-item:not(.no-result)"), function(el){
    el.addEventListener("mouseenter", function(){ setActiveSuggestion(parseInt(this.getAttribute("data-index"), 10)); });
  });
}
function setActiveSuggestion(idx){
  var items = $("searchSuggestions").querySelectorAll(".suggest-item:not(.no-result)");
  items.forEach(function(el){ el.classList.remove("active"); });
  suggestIndex = Math.max(0, Math.min(idx, items.length - 1));
  if(items[suggestIndex]) items[suggestIndex].classList.add("active");
}
function selectSuggestion(idx){
  var item = currentSuggestions[idx];
  if(!item || !item.location){ hideSuggestions(); return; }
  var label = item.title || item.address || "";
  $("addrInput").value = label;
  hideSuggestions();
  state.searchLoc = {lat: item.location.lat, lng: item.location.lng, label: label};
  state.origin = state.searchLoc;
  setLocStatus("ok", "查询地址：" + label);
  refreshDistances();
}
// 输入时触发联想
$("addrInput").addEventListener("input", function(){
  clearTimeout(suggestTimer);
  var kw = this.value.trim();
  if(kw.length < 1){ hideSuggestions(); return; }
  suggestTimer = setTimeout(function(){
    fetchSuggestions(kw, 8).then(function(list){ renderSuggestions(list); });
  }, 250);
});
// 键盘上下选择 / Enter 确认
$("addrInput").addEventListener("keydown", function(e){
  var showing = $("searchSuggestions").classList.contains("show");
  if(showing){
    if(e.key === "ArrowDown"){ e.preventDefault(); setActiveSuggestion(suggestIndex + 1); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); setActiveSuggestion(suggestIndex - 1); }
    else if(e.key === "Enter"){
      e.preventDefault();
      if(suggestIndex >= 0 && suggestIndex < currentSuggestions.length) selectSuggestion(suggestIndex);
      else{ hideSuggestions(); doSearch(); }
    }
  }else{
    if(e.key === "Enter") doSearch();
  }
});
// 建议框内点击：阻止 item 上的 mousedown 导致 input blur 消失，用事件委托让整行可点
$("searchSuggestions").addEventListener("mousedown", function(e){
  if(e.target.closest(".suggest-item:not(.no-result)")) e.preventDefault();
});
$("searchSuggestions").addEventListener("click", function(e){
  var item = e.target.closest(".suggest-item:not(.no-result)");
  if(!item) return;
  selectSuggestion(parseInt(item.getAttribute("data-index"), 10));
});
// 点击外部隐藏联想
$("addrInput").addEventListener("blur", function(){ setTimeout(hideSuggestions, 180); });
function refreshSuggestPosition(){
  if($("searchSuggestions").classList.contains("show")) positionSuggestions();
}
window.addEventListener("resize", refreshSuggestPosition);

// 二维码上传（压缩）
function compressImage(file, cb){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var MAX = 400, w = img.width, h = img.height;
      if(w > MAX){ h = h * MAX / w; w = MAX; }
      var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(cv.toDataURL("image/png"));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
$("fQr").onchange = function(e){
  var f = e.target.files[0];
  if(!f) return;
  compressImage(f, function(dataUrl){
    pendingQr = dataUrl;
    $("fQrImg").src = dataUrl;
    $("fQrName").textContent = "已选择（" + Math.round(dataUrl.length/1024) + " KB）";
    $("fQrPreview").style.display = "flex";
  });
};
// 地址自动解析 + 区域识别
var geoTimer;
$("fAddress").addEventListener("input", function(){
  clearTimeout(geoTimer);
  var addr = this.value.trim();
  if(addr.length < 6) return;
  // 自动识别区域
  ["海淀区","朝阳区","西城区","东城区","昌平区"].forEach(function(d){
    if(addr.indexOf(d) >= 0 && $("fDistrict").value !== d){ $("fDistrict").value = d; }
  });
  geoTimer = setTimeout(function(){
    var st = $("fGeoStatus");
    st.className = "geo-status show"; st.textContent = "正在解析地址…";
    geocode(addr).then(function(ll){
      if(ll){
        pendingGeo = {lat:ll.lat, lng:ll.lng};
        st.className = "geo-status show ok";
        st.textContent = "✓ 地址解析成功（" + ll.lat.toFixed(5) + ", " + ll.lng.toFixed(5) + "），可保存";
      }else{
        pendingGeo = null;
        st.className = "geo-status show err";
        st.textContent = "✗ 地址解析失败，保存后可在校区详情中编辑补充更详细地址";
      }
    });
  }, 600);
});
$("btnSave").onclick = function(){
  var name = $("fName").value.trim();
  var addr = $("fAddress").value.trim();
  var mgr = $("fManager").value.trim();
  if(!name){ toast("请填写校区名称"); return; }
  if(!addr){ toast("请填写校区地址"); return; }
  if(!mgr){ toast("请填写负责人姓名"); return; }
  var district = $("fDistrict").value || "其他";

  if(editingId){
    var target = allCampuses().filter(function(x){ return x.id === editingId; })[0];
    if(!target){ closeModal(); return; }
    if(target.custom){
      state.custom.forEach(function(c){ if(c.id === editingId){ c.name=name; c.address=addr; c.district=district; c.manager=mgr; c.geo=addr; } });
      sSet("custom", state.custom);
    }else{
      state.overrides[editingId] = { name:name, address:addr, district:district, manager:mgr, geo:addr };
      sSet("overrides", state.overrides);
    }
    if(pendingGeo){
      state.geoCache[addr] = pendingGeo;
      sSet("geoCache_v3", state.geoCache);
      runtimeCache[editingId] = runtimeCache[editingId] || {};
      runtimeCache[editingId].ll = pendingGeo;
    }
    if(pendingQr !== null){
      state.qrCache[editingId] = pendingQr;
      sSet("qr", state.qrCache);
    }
    closeModal();
    toast("校区「" + name + "」已更新");
    refreshDistances();
    selectCampus(editingId);
    return;
  }

  var id = "c" + Date.now();
  var campus = {
    id:id, name:name, address:addr,
    district: district,
    geo: addr, manager:mgr, business:"",
    custom:true
  };
  state.custom.push(campus);
  sSet("custom", state.custom);
  if(pendingGeo){
    state.geoCache[addr] = pendingGeo;
    sSet("geoCache_v3", state.geoCache);
    setCampusPos(campus, pendingGeo);
  }
  if(pendingQr){
    state.qrCache[id] = pendingQr;
    sSet("qr", state.qrCache);
  }
  closeModal();
  toast("校区「" + name + "」已添加");
  refreshDistances();
  selectCampus(id);
  if(!pendingGeo){
    setTimeout(function(){
      toast("地址尚未解析，请编辑「" + name + "」补充更详细地址");
    }, 400);
  }
};

/* ---------- 删除校区 ---------- */
function showConfirm(title, body, okText, okClass, onOk){
  $("confirmTitle").textContent = title;
  $("confirmBody").textContent = body;
  $("confirmOk").textContent = okText || "确定";
  $("confirmOk").className = "btn " + (okClass || "primary");
  $("confirmMask").classList.add("show");
  $("confirmOk").onclick = function(ev){ ev && ev.stopPropagation(); $("confirmMask").classList.remove("show"); dismissConfirm(); onOk(); };
  $("confirmCancel").onclick = function(ev){ ev && ev.stopPropagation(); $("confirmMask").classList.remove("show"); dismissConfirm(); };
  $("confirmMask").onclick = function(e){ if(e.target === $("confirmMask")){ $("confirmMask").classList.remove("show"); dismissConfirm(); } };
}
function dismissConfirm(){
  if(!$("modalMask").classList.contains("show") && !$("settingsMask").classList.contains("show")){
  }
}
function deleteCampus(id){
  var c = allCampuses().filter(function(x){ return x.id === id; })[0];
  if(!c) return;
  showConfirm("删除校区", "确定删除校区「" + c.name + "」吗？删除后不可恢复。", "删除", "danger", function(){
    if(c.custom){
      state.custom = state.custom.filter(function(x){ return x.id !== id; });
      sSet("custom", state.custom);
    }else{
      state.deletedIds.add(id);
      sSet("deleted", Array.from(state.deletedIds));
    }
    delete state.qrCache[id]; sSet("qr", state.qrCache);
    delete state.overrides[id]; sSet("overrides", state.overrides);
    delete runtimeCache[id];
    if(state.selectedId === id){ state.selectedId = null; $("detailCard").classList.remove("show"); }
    toast("已删除「" + c.name + "」");
    
    refreshDistances();
  });
}

/* ---------- 事件绑定 ---------- */
/* 设置面板事件 */
$("btnSettings").onclick = openSettings;
$("settingsClose").onclick = closeSettings;
$("settingsCancel").onclick = closeSettings;
$("settingsMask").addEventListener("click", function(e){ if(e.target === $("settingsMask")) closeSettings(); });
$("settingsSave").onclick = saveSettings;
$("sExport").onclick = exportData;
$("sImport").onclick = importData;

$("btnLocate").onclick = function(){
  if(!navigator.geolocation){ toast("当前浏览器不支持定位"); return; }
  setLocStatus("loading", "正在获取你的位置…");
  navigator.geolocation.getCurrentPosition(function(pos){
    var ll = {lat: pos.coords.latitude, lng: pos.coords.longitude};
    // 浏览器坐标是 WGS84，校区坐标是 GCJ02，先统一坐标系再计算距离
    wgs2gcj(ll).then(function(c){
      setMyLocation(c, "当前位置");
      toast("定位成功，已按距离排序校区");
    });
  }, function(err){
    var msg = "定位失败";
    if(err && err.code === 1) msg = "定位被拒绝：请在浏览器设置中允许位置权限";
    setLocStatus("err", msg);
  }, { enableHighAccuracy:true, timeout:10000, maximumAge:30000 });
};
$("btnSearch").onclick = doSearch;
$("zoomMask").addEventListener("click", function(){ this.classList.remove("show"); });

/* ---------- 启动 ---------- */
function boot(){
  resolveAllCampuses();
  renderCampusList();
}
function startApp(){
  renderCampusList();
  var pullPromise = (settings.ghToken && settings.gistId) ? syncPull() : Promise.resolve(null);
  pullPromise.catch(function(){}).then(function(){
    renderCampusList();
    boot();
  });
}
if(document.readyState === "complete") startApp(); else window.addEventListener("load", startApp);
